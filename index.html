<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestionale Tribute-A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  /* Colori presi dalle grafiche 2026: fondo scuro, arancio e blu petrolio */
  :root {
    --sfondo: #0e1113; --carta: #171c20; --carta2: #1f262b; --testo: #f3efe9; --tenue: #9aa4ab;
    --bordo: #2a3238; --arancio: #f08a3c; --arancio-testo: #1a0f06; --petrolio: #2f6f73;
    --verde: #5cc28a; --giallo: #f2c14e; --rosso: #ef6b5b;
    --nav-h: 64px; --raggio: 14px;
    --titoli: "Archivo Black", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: dark; /* icone di data/ora e tendine chiare sul fondo scuro */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--sfondo); color: var(--testo);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: var(--arancio); }
  h1, h2 { font-family: var(--titoli); font-weight: 400; letter-spacing: .01em; }
  h1 { font-size: 24px; margin: 4px 0 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; }

  #testa { position: sticky; top: 0; z-index: 9; display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: radial-gradient(120% 180% at 0% 0%, rgba(240,138,60,.35), transparent 55%),
                radial-gradient(120% 200% at 100% 0%, rgba(47,111,115,.55), transparent 60%), #111518;
    border-bottom: 1px solid var(--bordo); }
  #testa:empty { display: none; }
  #testa img { height: 34px; display: block; }
  .marchio { font-family: var(--titoli); font-size: 20px; letter-spacing: .02em; }
  .marchio small { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--tenue); margin-left: 6px; letter-spacing: 0; }
  .chi { font-size: 13px; color: var(--tenue); }

  #app { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  .carta { background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 14px 16px; margin-bottom: 12px; }
  .riga { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .tenue { color: var(--tenue); font-size: 14px; }
  .vuoto { color: var(--tenue); text-align: center; padding: 32px 0; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; min-height: 44px; color: var(--testo); }
  .btn { background: var(--arancio); color: var(--arancio-testo); font-weight: 700; }
  .btn-largo { width: 100%; margin-top: 12px; }
  .btn-sec { background: var(--carta2); border: 1px solid var(--bordo); }
  .btn-pericolo { background: transparent; color: var(--rosso); border: 1px solid rgba(239,107,91,.45); }
  .btn-pieno-pericolo { background: var(--rosso); color: #fff; font-weight: 700; }
  .btn-link { background: none; color: var(--arancio); padding: 8px 0; min-height: 0; }
  .azioni { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .azioni > * { flex: 1 1 auto; }
  a.btn-sec, a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    border-radius: 10px; padding: 10px 14px; min-height: 44px; color: var(--testo); }

  input, select, textarea { width: 100%; font: inherit; color: var(--testo); background: var(--carta2);
    border: 1px solid var(--bordo); border-radius: 10px; padding: 11px 12px; min-height: 46px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--arancio); outline-offset: -1px; }
  textarea { min-height: 96px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--tenue); margin: 12px 0 4px; }
  .campi { display: grid; grid-template-columns: 1fr; column-gap: 12px; }
  @media (min-width: 560px) { .campi { grid-template-columns: 1fr 1fr; } .campi .intero { grid-column: 1 / -1; } }

  /* Filtri */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--carta); border: 1px solid var(--bordo); border-radius: 999px;
    padding: 7px 13px; min-height: 36px; font-size: 14px; color: var(--tenue); }
  .chip.attivo { background: var(--arancio); color: var(--arancio-testo); border-color: var(--arancio); font-weight: 700; }
  #cerca { margin: 4px 0 10px; }

  /* Elenco eventi */
  .ev { display: flex; width: 100%; text-align: left; gap: 12px; align-items: center; background: var(--carta);
    border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 10px 12px; margin-bottom: 8px; }
  .ev.annullato { opacity: .5; }
  .ev.annullato .ev-tit { text-decoration: line-through; }
  .ev-data { flex: 0 0 50px; text-align: center; line-height: 1.1; background: var(--carta2); border-radius: 10px; padding: 6px 0; }
  .ev-data b { display: block; font-family: var(--titoli); font-weight: 400; font-size: 20px; }
  .ev-data span { display: block; font-size: 12px; text-transform: uppercase; color: var(--arancio); }
  .ev-data small { display: block; font-size: 11px; color: var(--tenue); }
  .ev-corpo { flex: 1 1 auto; min-width: 0; }
  .ev-tit { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-sotto { font-size: 13px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-dx { flex: 0 0 auto; text-align: right; font-size: 15px; font-weight: 650; align-self: flex-start; padding-top: 2px; }
  .ev-pill { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .pill.ok { background: rgba(92,194,138,.16); color: var(--verde); }
  .pill.att { background: rgba(242,193,78,.16); color: var(--giallo); }
  .pill.no { background: rgba(239,107,91,.16); color: var(--rosso); }
  .pill.neutra { background: var(--carta2); color: var(--tenue); }
  .riassunto { font-size: 13px; color: var(--tenue); margin: 2px 0 10px; }

  /* Scheda evento */
  .scheda h1 { margin-bottom: 6px; }
  .dati { margin: 0; display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 6px 12px; font-size: 15px; }
  .dati dt { color: var(--tenue); }
  .dati dd { margin: 0; overflow-wrap: anywhere; }
  .manca { color: var(--giallo); }
  .avvertenza { background: rgba(242,193,78,.1); border: 1px solid rgba(242,193,78,.35); border-radius: var(--raggio);
    padding: 12px 14px; margin: 10px 0 12px; font-size: 14px; }
  .testo-lungo { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }

  /* Riepilogo */
  .tessere { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (min-width: 560px) { .tessere { grid-template-columns: repeat(3, 1fr); } }
  .tessera { background: var(--carta); border: 1px solid var(--bordo); border-radius: var(--raggio); padding: 12px 14px; }
  .tessera .n { font-family: var(--titoli); font-size: 22px; line-height: 1.2; }
  .tessera .l { font-size: 13px; color: var(--tenue); }
  .tessere.tre { grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
  .tessere.tre .n { font-size: 16px; }
  .tessera.forte { background: linear-gradient(135deg, rgba(240,138,60,.28), rgba(47,111,115,.35)); }
  .mesi { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; }
  .mese { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .mese i { display: block; width: 100%; max-width: 28px; background: var(--arancio); border-radius: 4px 4px 0 0; min-height: 2px; }
  .mese i.futuro { background: var(--petrolio); }
  .mese span { font-size: 10px; color: var(--tenue); }
  .barre .b { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .barre .b i { display: block; height: 10px; border-radius: 5px; background: var(--petrolio); }
  .legenda { font-size: 12px; color: var(--tenue); margin-top: 6px; }
  .legenda b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 4px 0 10px; }

  /* Login */
  body.in-login #app { padding-top: 48px; }
  .login { max-width: 360px; margin: 0 auto; text-align: center; }
  .login img { max-width: 220px; width: 60%; margin: 0 auto 8px; display: block; }
  .login .marchio { font-size: 34px; }
  .login .nomi { display: grid; gap: 10px; margin-top: 18px; }
  .login .nomi button { font-size: 18px; font-weight: 700; padding: 16px; background: var(--carta); border: 1px solid var(--bordo); }
  .login input { text-align: center; font-size: 22px; letter-spacing: .3em; }

  /* Navigazione: barra in basso sul telefono, colonna a sinistra sugli schermi larghi */
  #nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #111518;
    border-top: 1px solid var(--bordo); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  #nav:empty { display: none; }
  #nav button { flex: 1; min-width: 0; background: none; color: var(--tenue); border-radius: 0; height: var(--nav-h); padding: 0 1px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; letter-spacing: -.01em; }
  #nav button .ico { font-size: 20px; }
  #nav button.attiva { color: var(--arancio); font-weight: 700; }
  @media (min-width: 800px) {
    #nav { top: 0; right: auto; width: 210px; flex-direction: column; justify-content: flex-start;
      border-top: 0; border-right: 1px solid var(--bordo); padding: 76px 8px 16px; gap: 4px; }
    #nav button { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 10px;
      height: 44px; padding: 0 12px; border-radius: 10px; font-size: 15px; }
    #nav button.attiva { background: var(--carta); }
    #testa { z-index: 11; }
    body:not(.in-login) #app { margin-left: 210px; max-width: none; padding: 24px 32px 32px; }
    body:not(.in-login) #app > * { max-width: 760px; }
  }

  /* Modale fatto in casa: confirm()/alert() nell'iframe di Apps Script possono non comparire */
  .modale { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modale .finestra { background: var(--carta); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
  .modale h2 { margin-top: 0; color: var(--testo); }
  .modale .campi { grid-template-columns: 1fr; }
  .modale .ev { background: var(--carta2); }
  .modale .ev-sotto { white-space: normal; }
  .modale .bottoni { display: flex; gap: 8px; margin-top: 16px; }
  .modale .bottoni button { flex: 1; }
  @media (min-width: 800px) { .modale { align-items: center; } .modale .finestra { border-radius: 18px; } }

  .avviso { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));
    background: var(--testo); color: var(--sfondo); padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 30;
    width: max-content; max-width: calc(100% - 32px); }
  .avviso.errore { background: var(--rosso); color: #fff; }
  .nascosto { display: none !important; }
  .idea { flex: 0 0 auto; width: 38px; height: 38px; min-height: 38px; padding: 0; border-radius: 50%; font-size: 18px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); }
  .carta.idea-carta { border-left: 4px solid var(--arancio); }
  .carta.idea-carta.letto { border-left-color: var(--petrolio); }
  .carta.idea-carta.fatto { border-left-color: var(--verde); opacity: .7; }
  .btn-piccolo-sec { padding: 6px 10px; min-height: 34px; font-size: 13px; }
  .chi { position: relative; }
  .chi .badge { top: -6px; right: -6px; }
  .chi { background: none; border: 1px solid var(--bordo); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; color: var(--testo); }
  .recap { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 -apple-system, sans-serif; background: var(--carta2);
    border-radius: 10px; padding: 12px; margin: 10px 0 0; max-height: 360px; overflow-y: auto; }
  .check { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border-radius: 0;
    padding: 8px 0; min-height: 40px; border-bottom: 1px solid var(--bordo); font-size: 15px; }
  .check:last-child { border-bottom: 0; }
  .check .box { flex: 0 0 26px; height: 26px; border-radius: 7px; border: 1px solid var(--bordo); background: var(--carta2);
    display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .check.ok .box { background: var(--verde); border-color: var(--verde); color: #0e1113; }
  .check.ok .t { color: var(--tenue); }
  .check .auto { font-size: 11px; color: var(--tenue); margin-left: auto; white-space: nowrap; }
  .progresso { height: 8px; background: var(--carta2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progresso i { display: block; height: 100%; background: var(--verde); }
  .compito { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--bordo); }
  .compito:last-child { border-bottom: 0; }
  .compito .t { flex: 1 1 auto; min-width: 0; text-align: left; background: none; padding: 6px 0; min-height: 0; color: var(--testo); }
  .compito.fatto .t { color: var(--tenue); text-decoration: line-through; }
  .scaduto { color: var(--rosso); font-weight: 700; }
  .gantt .r { display: grid; grid-template-columns: minmax(80px, 30%) 1fr; gap: 8px; align-items: center; margin: 10px 0; font-size: 13px; }
  .gantt .r > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gantt .track { position: relative; height: 18px; background: var(--carta2); border-radius: 9px; }
  .gantt .bar { position: absolute; top: 0; height: 100%; border-radius: 9px; background: var(--petrolio); overflow: hidden; min-width: 6px; }
  .gantt .bar i { display: block; height: 100%; background: var(--arancio); }
  .gantt .oggi { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--rosso); }
  .gantt .mesi-g { position: relative; height: 16px; font-size: 10px; color: var(--tenue); }
  .gantt .mesi-g span { position: absolute; transform: translateX(-50%); }
  .voce { display: block; width: 100%; text-align: left; background: var(--carta2); border: 1px solid var(--bordo);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .voce.scelta { border-color: var(--arancio); box-shadow: inset 0 0 0 1px var(--arancio); background: rgba(240,138,60,.08); }
  .voce .riga b { font-size: 15px; }
  .voce .desc { font-size: 13px; color: var(--tenue); margin-top: 2px; }
  .extra { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--bordo); padding: 6px 0; }
  .extra:last-child { border-bottom: 0; }
  .spunta { flex: 0 0 auto; width: 32px; height: 32px; min-height: 32px; padding: 0; border-radius: 8px; color: var(--testo);
    background: var(--carta2); border: 1px solid var(--bordo); font-size: 18px; line-height: 30px; }
  .spunta.on { background: var(--arancio); color: var(--arancio-testo); border-color: var(--arancio); }
  .compito .spunta.on { background: var(--verde); border-color: var(--verde); color: #0e1113; }
  .extra .nome { flex: 1 1 auto; min-width: 0; }
  .extra input { width: 70px; min-height: 36px; padding: 6px 8px; text-align: right; }
  .totali { background: linear-gradient(135deg, rgba(240,138,60,.18), rgba(47,111,115,.25)); border-radius: var(--raggio); padding: 14px 16px; }
  .totali .riga { padding: 3px 0; }
  .totali .grande { font-family: var(--titoli); font-size: 22px; }
  .voci-recap { border-bottom: 1px solid rgba(255,255,255,.18); padding-bottom: 8px; margin-bottom: 6px; }
  .voci-recap .voce-recap { font-size: 14px; padding: 2px 0; }
  .voci-recap .voce-recap > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .voci-recap .voce-recap > span:last-child { white-space: nowrap; }
  .totali input { width: 110px; min-height: 36px; padding: 6px 8px; text-align: right; }
  .stati { display: flex; gap: 6px; flex-wrap: wrap; }
  .sugg { margin-top: 4px; border: 1px solid var(--bordo); border-radius: 10px; overflow-y: auto; max-height: 260px; }
  .sugg:empty { display: none; }
  .sugg-voce { display: block; width: 100%; text-align: left; background: var(--carta2); border-radius: 0; padding: 10px 12px;
    min-height: 44px; border-bottom: 1px solid var(--bordo); font-size: 15px; }
  .sugg-voce:last-child { border-bottom: 0; }
  .sugg-voce .tenue { font-size: 13px; }
  #nav .ico { position: relative; }
  .badge { position: absolute; top: -4px; right: -12px; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--rosso); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; font-family: -apple-system, sans-serif; }
  .contatto { padding: 4px 0; border-bottom: 1px solid var(--bordo); align-items: center; }
  .contatto:last-of-type { border-bottom: 0; }
  .contatto .btn-link { text-align: left; color: var(--testo); padding: 8px 0; }
  .contatto a { text-decoration: none; font-size: 20px; margin-left: 6px; }
  .btn-x { background: none; color: var(--tenue); font-size: 22px; padding: 4px 8px; min-height: 36px; }
</style>

<body>

<script>
// ─── Versione e changelog: VERSIONE deve essere uguale alla prima voce (lo controlla il test)
var VERSIONE = '0.47';
var CHANGELOG = [
  { v: '0.47', data: '2026-11-12', testo: 'Apertura istantanea dal link di Google: si vedono subito gli ultimi dati e si aggiornano da soli (sul sito col Face ID no, per riservatezza). Copia di sicurezza automatica del foglio dati ogni lunedì notte nella cartella Backup sul Drive della band (restano le ultime 8), più il pulsante "Fai una copia adesso" in Altro.' },
  { v: '0.46', data: '2026-11-12', testo: 'Face ID: se su un dispositivo non è ancora attivo (es. attivato solo col dito sul Mac), l\'app lo dice chiaramente e ti porta al PIN; poi lo attivi anche lì da Altro → Face ID. Nell\'elenco dei dispositivi compare anche "Mac".' },
  { v: '0.45', data: '2026-11-12', testo: 'Accesso con Face ID, come nell\'app delle finanze: funziona dall\'app fuori da Google (link in Altro → Face ID). Ognuno entra col suo PIN, attiva il Face ID sul suo telefono e da lì in poi entra guardando lo schermo. I dati restano nel foglio della band: online c\'è solo la pagina.' },
  { v: '0.44', data: '2026-11-12', testo: 'Recap automatico anche il giorno stesso dell\'evento: alle 9 arriva "🎸 Oggi si suona" con lo stesso riassunto (orari, indirizzo, contatti), oltre a quello di 3 giorni prima.' },

// verso la web app, senza cookie Google: stesso codice, niente problema "/u/1/" con più account nel browser.
var API_URL = 'https://script.google.com/macros/s/AKfycbzFQTgnms2pa01cVrtcpC-oy5PH21eZ1sbL9S4QefigTmYcA0hdAGypQEN2Cbcn19T0/exec';
var FUORI = typeof google === 'undefined' || !google.script; // true = pagina su GitHub Pages (lì funziona il Face ID)
if (FUORI) {
  var chiamaApi = function (ok, ko) {
    var r = {
      withSuccessHandler: function (f) { return chiamaApi(f, ko); },
      withFailureHandler: function (f) { return chiamaApi(ok, f); }
    };
    ['getDati', 'accedi', 'azione', 'cercaLuogo', 'similiCalendario', 'sfidaPasskey', 'accediPasskey'].forEach(function (fn) {
      r[fn] = function () {
        var args = Array.prototype.slice.call(arguments);
        // Google ogni tanto risponde con una sua pagina d'errore: le letture si ritentano da sole, i salvataggi
        // no (potrebbero essere già andati a buon fine: meglio che la persona controlli e riprovi).
        var tentativi = fn === 'azione' ? 1 : 3;
        var prova = function () {
          tentativi--;
          fetch(API_URL, { method: 'POST', credentials: 'omit', redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
            .then(function (x) { return x.text(); })
            .then(function (t) {
              var j;
              try { j = JSON.parse(t); } catch (e) { throw new Error('risposta non valida da Google'); }
              if (j.ok) { if (ok) ok(j.r); } else if (ko) ko(new Error(j.e));
            })
            .catch(function (err) {
              if (tentativi > 0) return setTimeout(prova, 800);
              if (ko) ko(new Error((fn === 'azione' ? 'Non so se è stato salvato: ricarica e controlla. ' : 'Connessione non riuscita, riprova. ') + '(' + err.message + ')'));
            });
        };
        prova();
      };
    });
    return r;
  };
  window.google = { script: {} };
  Object.defineProperty(window.google.script, 'run', { get: function () { return chiamaApi(null, null); } });
}

// ─── Utilità
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(id) { return document.getElementById(id); }
// Fuori da Google (sito col Face ID) il token resta solo finché l'app è aperta: a ogni apertura Face ID o PIN, come in Finanze
function ricorda(k, v) {
  try {
    var st = FUORI && k === 'tok' ? sessionStorage : localStorage;
    if (v === undefined) return st.getItem(k) || '';
    if (v === null) st.removeItem(k); else st.setItem(k, v);
  } catch (e) { return ''; }
}
// ─── Face ID (passkey), come in Finanze: solo sul sito fuori da Google
function b64u(buf) {
  var b = new Uint8Array(buf), t = '';
  for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]);
  return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function deb64u(x) {
  x = String(x).replace(/-/g, '+').replace(/_/g, '/');
  while (x.length % 4) x += '=';
  var t = atob(x), b = new Uint8Array(t.length);
  for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i);
  return b;
}

function num(x) { var n = parseFloat(String(x == null ? '' : x).replace(',', '.')); return isNaN(n) ? 0 : n; }
function euro(x) {
  var n = Math.round(num(x) * 100) / 100;
  var p = (n % 1 ? n.toFixed(2) : String(n)).split('.');
  return '€ ' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (p[1] ? ',' + p[1] : '');
}
function parti(d) { var p = String(d).split('-').map(Number); return { a: p[0], m: p[1], g: p[2] }; }
function dataLunga(d) {
  var p = parti(d); if (!p.a) return '';
  return GIORNI[new Date(p.a, p.m - 1, p.g).getDay()] + ' ' + p.g + ' ' + MESI_LUNGHI[p.m - 1] + ' ' + p.a;
}
function eventi() { return (DATI && DATI.eventi) || []; }
function trova(id) { return eventi().filter(function (e) { return e.id === id; })[0] || null; }
function passato(e) { return e.data < DATI.oggi; }
function incassato(e) {
  if (e.stato === 'annullato') return 0;
  if (e.saldoRicevuto === 'Sì') return num(e.totale);
  if (e.anticipoRicevuto === 'Sì') return num(e.anticipo);
  return 0;
}
function residuo(e) { return e.stato === 'annullato' ? 0 : Math.max(0, num(e.totale) - incassato(e)); }
function mancanti(e) {
  if (e.stato === 'annullato') return [];
  return OBBLIGATORI.filter(function (x) { return !e[x[0]]; }).map(function (x) { return x[1]; });
}
/** Numero per WhatsApp e per chiamare, col prefisso: "333 123 4567" → 393331234567, "045 123456" → 39045123456,
 *  "+39 …"/"0039 …" → 39…, "0064 22…" → 6422…. Se nella casella ci sono due numeri si prende il primo. */
function soloCifre(t) {
  var s = String(t || '').trim();
  var primo = s.split(/[\/,;|]|\s+(?:-|o|oppure|e)\s+/).filter(function (p) { return p.replace(/\D/g, '').length >= 6; })[0] || s;
  primo = primo.trim();
  var c = primo.replace(/\D/g, '');
  if (!c) return '';
  if (primo.charAt(0) === '+') return c;
  if (c.indexOf('00') === 0) return c.slice(2);
  if (/^3\d{8,9}$/.test(c) || /^0\d{5,10}$/.test(c)) return '39' + c; // cellulare o fisso italiano
  return c;
}
/** "+39 333 123 4567" per far vedere a quale numero si apre WhatsApp. */
function numeroLeggibile(c) { return c ? '+' + c.replace(/^39(?=\d{9,})/, '39 ') : ''; }
function dataIt(d) { return String(d || '').split('-').reverse().join('/'); }
function giorniTra(a, b) {
  var x = parti(a), y = parti(b);
  return Math.round((new Date(y.a, y.m - 1, y.g) - new Date(x.a, x.m - 1, x.g)) / 86400000);
}
function contatti() { return (DATI && DATI.contatti) || []; }
function contatto(id) { return contatti().filter(function (c) { return c.id === id; })[0] || null; }
function idsContatti(e) { try { var l = JSON.parse(e.contatti || '[]'); return Array.isArray(l) ? l : []; } catch (x) { return []; } }
function contattiDi(e) { return idsContatti(e).map(contatto).filter(Boolean); }
function eventiDi(c) {
  return eventi().filter(function (e) { return idsContatti(e).indexOf(c.id) >= 0; })
    .sort(function (a, b) { return a.data < b.data ? 1 : -1; });
}
function linkWa(tel, testo) { return 'https://wa.me/' + tel + (testo ? '?text=' + encodeURIComponent(testo) : ''); }
function linkInstagram(x) { x = String(x || '').trim(); return /^https?:/i.test(x) ? x : 'https://instagram.com/' + x.replace(/^@/, ''); }

function linkMappa(e) {
  if (/^https?:\/\//i.test(e.indirizzo || '')) return e.indirizzo;
  var q = e.indirizzo || e.luogo;
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';

var FILTRI_STATO = [['dafare', 'Da fare'], ['dacompletare', 'Da completare'], ['daincassare', 'Da incassare'],
  ['passati', 'Passati'], ['annullati', 'Annullati'], ['tutti', 'Tutti']];

function filtrati() {
  var f = FILTRO, q = f.q.trim().toLowerCase();
  var l = eventi().filter(function (e) {
    if (f.anno && e.data.slice(0, 4) !== f.anno) return false;
    var ann = e.stato === 'annullato';
    switch (f.stato) {
      case 'dafare': if (ann || passato(e)) return false; break;
      case 'dacompletare': if (passato(e) || !mancanti(e).length) return false; break;
      case 'daincassare': if (!residuo(e)) return false; break;
      case 'passati': if (ann || !passato(e)) return false; break;
      case 'annullati': if (!ann) return false; break;
    }
    if (q && [e.titolo, e.luogo, e.referente, e.tipo, e.note].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var crescente = f.stato === 'dafare' || f.stato === 'dacompletare';
  return l.sort(function (a, b) { return crescente ? (a.data < b.data ? -1 : 1) : (a.data < b.data ? 1 : -1); });
}

function anni() {
  var s = {};
  eventi().forEach(function (e) { if (e.data) s[e.data.slice(0, 4)] = 1; });
  ((DATI && DATI.spese) || []).forEach(function (x) { if (x.data) s[String(x.data).slice(0, 4)] = 1; });
  return Object.keys(s).sort();
}

function sezioneContatti(e) {

var DOPPI_NO = {};   // coppie segnate "non sono doppioni" (fino a quando si ricarica la pagina)

function chiaveCompatta(t) { return normTxt(String(t || '').replace(/\([^)]*\)/g, '')).replace(/[^a-z0-9]/g, ''); }
function distanza(a, b) { // Levenshtein, per nomi corti
  var d = [], i, j;
  for (i = 0; i <= a.length; i++) d[i] = [i];
  for (j = 1; j <= b.length; j++) d[0][j] = j;
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function paroleNome(t) { return normTxt(String(t || '').replace(/\([^)]*\)/g, '')).split(/[^a-z0-9]+/).filter(Boolean); }
/** Perché due contatti sembrano la stessa cosa ('' se no). */
function sembraDoppio(a, b) {
  var ta = soloCifre(a.telefono).slice(-9), tb = soloCifre(b.telefono).slice(-9);
  if (ta.length >= 6 && ta === tb) return 'stesso telefono';
  var ka = chiaveCompatta(a.nome), kb = chiaveCompatta(b.nome);
  if (ka.length >= 5 && kb.length >= 5 && distanza(ka, kb) <= (Math.min(ka.length, kb.length) >= 9 ? 2 : 1)) return 'nome quasi uguale';
  var pa = paroleNome(a.nome), pb = paroleNome(b.nome);
  var corto = pa.length <= pb.length ? pa : pb, lungo = pa.length <= pb.length ? pb : pa;
  if (corto.length >= 2 && corto.length < lungo.length && corto.every(function (p) { return lungo.indexOf(p) >= 0; })) return 'un nome contiene l\'altro';
  return '';
}

}

// ─── Messaggi dopo l'evento
function leggiQuando(q) { var m = String(q || '').match(/^(giorni|data):(.+)$/); return m ? { tipo: m[1], v: m[2] } : { tipo: 'giorni', v: '10' }; }
function descriviQuando(q) {
  if (q === 'richiesta') return 'quando premi "Chiedi le info" in un evento';
  var x = leggiQuando(q);
  return x.tipo === 'giorni' ? x.v + ' giorni dopo l\'evento' : 'dal ' + x.v.split('-').reverse().join('/') + ' (fine stagione)';
}
function nomeModello(id) { var m = ((DATI && DATI.modelli) || []).filter(function (x) { return x.id === id; })[0]; return m ? m.nome : id; }

/**
 * Messaggi "maturi" e non ancora mandati/saltati. Chiave: modello|evento|contatto, oppure
 * modello|anno|contatto per "collaborazione" (un messaggio per contatto con tutte le date dell'anno).
 * Finestra: da quando è il momento fino a 120 giorni dopo (o fino al 31 gennaio per quelli di fine stagione).
 */
function daMandare() {
  if (!DATI || !DATI.modelli) return [];
  var fatti = {}, oggi = DATI.oggi, out = [];
  (DATI.invii || []).forEach(function (i) { fatti[i.chiave] = 1; });
  // Richieste di info mancanti: in cima, finché l'evento non è passato
  var mInfo = DATI.modelli.filter(function (m) { return m.quando === 'richiesta'; })[0];
  ((DATI.richieste) || []).forEach(function (r) {
    var chiave = 'info|' + r.id + '|' + r.contattoId, e = trova(r.eventoId), c = contatto(r.contattoId);
    if (!mInfo || fatti[chiave] || !e || !c || e.stato === 'annullato' || e.data < oggi) return;
    out.push({ chiave: chiave, modello: mInfo, contatto: c, eventi: [e], domande: String(r.domande || '').split('\n').filter(Boolean), urgente: true });
  });
  // Fine stagione, due categorie: "arrivederci" SE E SOLO SE il contatto ha eventi in programma (confermati, da oggi in poi),
  // altrimenti "collaborazione". Chiavi diverse; se uno dei due è già mandato/saltato per quell'anno l'altro non si propone.
  var mArriv = DATI.modelli.filter(function (m) { return m.id === 'arrivederci'; })[0];
  var futureDi = function (c) {
    return eventi().filter(function (e) { return e.stato === 'confermato' && e.data >= oggi && idsContatti(e).indexOf(c.id) >= 0; })
      .sort(function (a, b) { return a.data < b.data ? -1 : 1; });
  };
  var perAnno = { collaborazione: true, arrivederci: true };
  DATI.modelli.forEach(function (m) {
    if (m.quando === 'richiesta') return;
    if (m.id === 'arrivederci' && !mArriv) return;
    var ruoli = String(m.destinatari || '').split(','), q = leggiQuando(m.quando), perChiave = {};
    var maturo = function (d) {
      if (d >= oggi) return false;
      if (q.tipo === 'giorni') { var g = giorniTra(d, oggi); return g >= Number(q.v) && g <= Number(q.v) + 120; }
      var anno = Number(d.slice(0, 4));
      return oggi >= anno + '-' + q.v && oggi <= (anno + 1) + '-01-31';
    };
    eventi().forEach(function (e) {
      if (e.stato === 'annullato' || !e.data || !maturo(e.data)) return;
      contattiDi(e).forEach(function (c) {
        if (ruoli.indexOf(c.ruolo) < 0) return;
        var anno = e.data.slice(0, 4);
        var chiave = m.id + '|' + (perAnno[m.id] ? anno : e.id) + '|' + c.id;
        if (fatti[chiave]) return;
        if (perAnno[m.id]) {
          var conFuture = futureDi(c).length > 0;
          if (m.id === 'arrivederci' && !conFuture) return;               // solo con eventi in programma
          if (m.id === 'collaborazione' && conFuture && mArriv) return;    // a loro va "arrivederci"
          var altro = (m.id === 'arrivederci' ? 'collaborazione' : 'arrivederci') + '|' + anno + '|' + c.id;
          if (fatti[altro]) return;                                        // già mandato l'altro: niente doppioni
        }
        (perChiave[chiave] = perChiave[chiave] || { chiave: chiave, modello: m, contatto: c, eventi: [] }).eventi.push(e);
      });
    });
    Object.keys(perChiave).forEach(function (k) {
      var x = perChiave[k];
      x.eventi.sort(function (a, b) { return a.data < b.data ? -1 : 1; }); // date in ordine nel messaggio
      x.prossimi = futureDi(x.contatto);
      out.push(x);
    });
  });
  return out.sort(function (a, b) {
    if (!!a.urgente !== !!b.urgente) return a.urgente ? -1 : 1;
    return a.eventi[0].data < b.eventi[0].data ? -1 : 1;
  });
}

/** Solo i nomi, senza cognomi: "Laura Neri" → "Laura", "Laura Neri e Paolo Bianco" → "Laura e Paolo". */
var NOMI_ENTI = /^(pro ?loco|comune|associazione|ass\.|circolo|comitato|gruppo|parrocchia|oratorio|bar|pub|birreria|ristorante|pizzeria|osteria|trattoria|agriturismo|hotel|villa|corte|cantina|locanda|tenuta|castello|club|asd|aps)\b/i;
function soloNome(t) {
  if (NOMI_ENTI.test(String(t || '').trim())) return String(t).replace(/\s*\([^)]*\)/g, '').trim(); // enti e locali: nome intero
  return String(t || '').replace(/\s*\([^)]*\)/g, '').split(/\s+(?:e|&)\s+|\s*,\s*/i)
    .map(function (p) { return p.trim().split(/\s+/)[0]; }).filter(Boolean).join(' e ');
}

// Tipo di evento nei messaggi: "il vostro matrimonio", "la vostra sagra"… [nome, femminile?]
var EVENTO_MSG = { Matrimonio: ['matrimonio', false], Sagra: ['sagra', true], Locale: ['serata', true], Privato: ['festa', true], Altro: ['evento', false] };
var PREP_EVENTO = { di: 'de', del: 'de', della: 'de', dello: 'de', a: 'a', al: 'a', alla: 'a', allo: 'a', in: 'ne', nel: 'ne', nella: 'ne', nello: 'ne',
  da: 'da', dal: 'da', dalla: 'da', dallo: 'da', su: 'su', sul: 'su', sulla: 'su', sullo: 'su', il: '', la: '', lo: '' };
/** Sostituisce {evento} (o "-tipo di evento-" scritto a mano) accordando la parola prima:
 *  "del {evento}" → "del vostro matrimonio" / "della vostra sagra"; "per {evento}" → "per il vostro matrimonio". */
function conEvento(t, tipo) {
  var x = EVENTO_MSG[tipo] || EVENTO_MSG.Altro, f = x[1];
  return String(t || '').replace(/(?:\b(di|del|della|dello|a|al|alla|allo|in|nel|nella|nello|da|dal|dalla|dallo|su|sul|sulla|sullo|il|la|lo)\s+)?(?:\{evento\}|[-–(\[]\s*tipo\s+(?:di|dell'|d')\s*evento\s*[-–)\]])/gi,
    function (_, prep) {
      var p = prep ? PREP_EVENTO[prep.toLowerCase()] : '';
      var art = (p === '' ? (f ? 'la' : 'il') : p + (f ? 'lla' : 'l'));
      var out = art + (f ? ' vostra ' : ' vostro ') + x[0];
      return prep && prep.charAt(0) !== prep.charAt(0).toLowerCase() ? out.charAt(0).toUpperCase() + out.slice(1) : out;
    });

// Dove lasciare un feedback: il canale da cui ci hanno trovato (tramite degli eventi insieme); passaparola e altri = Musiqua
var LINK_FEEDBACK = { 'Musiqua': 'https://www.musiqua.it/band/tribute-a-27189', 'Matrimonio.com': 'https://www.matrimonio.com/shared/rate/424261',
  'Showgroup': 'https://www.showgroup.it/vetrina/tribute-a' };
function canaleFeedback(eventi) {
  var conta = {}, ultimo = {};
  (eventi || []).forEach(function (e) {
    var t = normTxt(e.tramite), c = /musiqua/.test(t) ? 'Musiqua' : /matrimoni/.test(t) ? 'Matrimonio.com' : /showgroup/.test(t) ? 'Showgroup' : '';
    if (!c) return;
    conta[c] = (conta[c] || 0) + 1;
    if (!ultimo[c] || e.data > ultimo[c]) ultimo[c] = e.data;
  });
  var l = Object.keys(conta).sort(function (a, b) { return conta[b] - conta[a] || (ultimo[a] < ultimo[b] ? 1 : -1); });
  return l[0] || 'Musiqua';
}

function componi(x) {
  var e = x.eventi[0];
  // nelle richieste di info si saluta solo col nome
  // per location/catering si saluta il referente (la persona), non il nome del posto
  var chi = x.contatto.referente || x.contatto.nome;
  var val = { nome: x.modello.id === 'info' ? soloNome(chi) : chi, sposi: e.titolo, data: dataMessaggio(e.data), luogo: e.luogo || '',
    date: x.eventi.map(function (y) { return '• ' + y.titolo + ' (' + dataMessaggio(y.data) + ')'; }).join('\n'),
    mancanti: (x.domande || []).map(function (d) { return '• ' + d; }).join('\n'),
    prossime: (x.prossimi || []).map(function (y) { return '• ' + y.titolo + ' (' + dataMessaggio(y.data) + ')'; }).join('\n') };
  val.canale = canaleFeedback(x.eventi.concat(x.prossimi || []));
  val.link = LINK_FEEDBACK[val.canale];
  var sost = function (t) { return conEvento(t, e.tipo).replace(/\{(nome|sposi|data|luogo|date|mancanti|prossime|canale|link)\}/g, function (_, k) { return val[k]; }); };
  x.saluto = val.nome; // per i due WhatsApp degli sposi: si sostituisce con il nome di chi riceve
  return { oggetto: sost(x.modello.oggetto), testo: sost(x.modello.testo) };
}

function domandeProposte(e) {

function spese() { return (DATI && DATI.spese) || []; }
function calcolaRoi(anno) {
  var per = {}, cat = {}, spesaTot = 0, entrateTot = 0;
  var riga = function (k) { return (per[k] = per[k] || { nome: k, investito: 0, entrate: 0, date: 0 }); };
  spese().forEach(function (x) {
    if (String(x.data).slice(0, 4) !== anno) return;
    var imp = num(x.importo);
    spesaTot += imp;
    cat[x.categoria || 'Altro'] = (cat[x.categoria || 'Altro'] || 0) + imp;
    if (x.piattaforma) riga(x.piattaforma).investito += imp;
  });
  eventi().forEach(function (e) {
    if (e.stato === 'annullato' || String(e.data).slice(0, 4) !== anno) return;
    entrateTot += num(e.totale);
    var r = riga(e.tramite || 'Non indicato');
    r.entrate += num(e.totale); r.date++;
  });
  var righe = Object.keys(per).map(function (k) {
    var r = per[k];
    r.roi = r.investito ? (r.entrate - r.investito) / r.investito : null;
    r.costoData = r.investito && r.date ? r.investito / r.date : null;
    return r;
  }).sort(function (a, b) { return (b.investito - a.investito) || (b.entrate - a.entrate); });
  return { righe: righe, categorie: cat, spese: spesaTot, entrate: entrateTot, utile: entrateTot - spesaTot };
}

// ─── Suggerimenti mentre si scrive
var SUGG = {};
// Telefono messo dalla tendina (referente o evento già fatto): se poi si cambia il referente, quel numero non è suo
var TEL_AUTO = null;
// campo → tendina: f-referente/f-luogo/f-titolo/f-tramite (eventi e preventivi), sp-piattaforma (spese), c-nome (contatto nuovo)
var CAMPI_SUGG = { 'f-referente': 'referente', 'f-luogo': 'luogo', 'f-titolo': 'titolo', 'f-tramite': 'tramite', 'sp-piattaforma': 'piattaforma', 'c-nome': 'cnome' };
function normTxt(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim(); }
function eventiRecenti() { return eventi().slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; }); }

function suggerimenti(k, q) {
  var n = normTxt(q), out = [], visti = {};
  if (!n) return [];
  // con una lettera sola: solo i nomi che iniziano così (a tendina, tutti); da due lettere anche quelli che la contengono
  var va = function (nome) { var t = normTxt(nome); return n.length === 1 ? t.indexOf(n) === 0 : t.indexOf(n) >= 0; };
  var aggiungi = function (x) {
    var key = normTxt(x.nome).replace(/\s*\([^)]*\)/g, '') + '|' + (k === 'referente' || k === 'cnome' ? soloCifre(x.telefono).slice(-9) : '');
    if (!x.nome || !va(x.nome)) return;
    if (visti[key]) { // già in elenco: completo i dati che mancano (es. indirizzo dall'evento)
      if (k === 'titolo') return; // per i titoli vale l'evento più recente
      var y = out[visti[key] - 1];
      Object.keys(x).forEach(function (c) { if (!y[c] && x[c]) y[c] = x[c]; });
      return;
    }
    out.push(x);
    visti[key] = out.length;
  };
  if (k === 'tramite' || k === 'piattaforma') {
    DATI.liste.canali.forEach(function (c) { aggiungi({ nome: c }); });
  } else if (k === 'cnome') {
    contatti().forEach(function (c) { aggiungi({ nome: c.nome, telefono: c.telefono, ruolo: c.ruolo, id: c.id }); });
  } else if (k === 'titolo') { // eventi già fatti (il più recente per primo): servono per le date che si ripetono
    eventiRecenti().forEach(function (e) {
      aggiungi({ nome: e.titolo, tipo: e.tipo, luogo: e.luogo, indirizzo: e.indirizzo, referente: e.referente, telefono: e.telefono, tramite: e.tramite });
    });
  } else if (k === 'referente') {
    contatti().filter(function (c) { return c.ruolo !== 'Location'; }).forEach(function (c) { aggiungi({ nome: c.nome, telefono: c.telefono, ruolo: c.ruolo }); });
    eventiRecenti().forEach(function (e) { if (e.referente) aggiungi({ nome: e.referente, telefono: e.telefono, ruolo: '' }); });
  } else {
    contatti().filter(function (c) { return c.ruolo === 'Location'; }).forEach(function (c) { aggiungi({ nome: c.nome, indirizzo: c.indirizzo || '' }); });
    eventiRecenti().forEach(function (e) {
      if (!e.luogo) return;
      var link = /^https?:/i.test(e.indirizzo || '');
      aggiungi({ nome: e.luogo, indirizzo: link ? '' : (e.indirizzo || ''), mappa: link ? e.indirizzo : '' });
    });
  }
  // prima chi inizia con quello che hai scritto, poi in ordine alfabetico
  var inizia = function (x) { return normTxt(x.nome).indexOf(n) === 0 ? 0 : 1; };
  out.sort(function (a, b) { return inizia(a) - inizia(b) || normTxt(a.nome).localeCompare(normTxt(b.nome)); });
  return out.slice(0, 30);
}

      return '<button class="sugg-voce" data-az="scegliSugg" data-k="' + k + '" data-i="' + i + '"><b>' + esc(x.nome) + '</b> <span class="tenue">' +

// ─── Preventivi
function preventivi() { return (DATI && DATI.preventivi) || []; }
function preventiviDi(eventoId) { return preventivi().filter(function (p) { return p.eventoId === eventoId; }); }
/** Il preventivo "che conta" dell'evento: quello accettato, sennò il più recente. */
function preventivoDi(eventoId) {
  var l = preventiviDi(eventoId).slice().sort(function (a, b) { return String(a.modificato || '') < String(b.modificato || '') ? 1 : -1; });
  return l.filter(function (p) { return p.stato === 'accettato'; })[0] || l[0] || null;
}
var PAROLE_COMUNI = ['matrimonio', 'matromonio', 'sagra', 'festa', 'privata', 'privato', 'aziendale', 'compleanno', 'party', 'concerto', 'evento', 'locale', 'della', 'delle', 'dello', 'forse'];
/** Parole distintive di un nome (come paroleChiave_ nel server): "Forse matrimonio Laura" → ["laura"]. */
function paroleChiave(t) { return normTxt(t).split(/[^a-z0-9]+/).filter(function (p) { return p.length >= 4 && PAROLE_COMUNI.indexOf(p) < 0; }); }
function simili(a, b) { var pb = paroleChiave(b); return paroleChiave(a).some(function (p) { return pb.indexOf(p) >= 0; }); }
function vociListino(listino, tipo) {
  return ((DATI && DATI.listino) || []).filter(function (v) { return v.listino === listino && v.tipo === tipo && v.attivo !== 'No'; })
    .sort(function (a, b) { return num(a.ordine) - num(b.ordine); });
}
function voceListino(id) { return ((DATI && DATI.listino) || []).filter(function (v) { return v.id === id; })[0] || null; }
function piuGiorni(d, n) { var p = parti(d), x = new Date(p.a, p.m - 1, p.g + n); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }

// Campi dell'evento che si compilano dal preventivo (stessi id del modulo di modifica: f-…)
var CAMPI_PREV_EV = ['titolo', 'tipo', 'data', 'luogo', 'indirizzo', 'referente', 'telefono', 'ruoloReferente', 'tramite', 'contattatoDa', 'arrivo', 'inizio', 'fine'];
var SCHEDA_PREV = [
  ['Orari', [['oraCerimonia', 'Cerimonia', 'time'], ['oraAperitivo', 'Aperitivo', 'time'], ['oraCena', 'Cena', 'time'], ['oraTorta', 'Taglio torta', 'time']]],

  ['Logistica', [['ospiti', 'Numero ospiti', 'num'], ['esterno', 'All\'aperto?', 'si'], ['copertura', 'Copertura se piove', 'text'],
    ['corrente', 'Corrente (prese, distanza…)', 'text'], ['pastiBand', 'Pasti band', 'text'],
    ['pernottamento', 'Pernottamento per la band? (a carico del cliente)', 'si'], ['notePernottamento', 'Pernottamento: dettagli (notti, persone, dove…)', 'text'],
    ['noteTecniche', 'Note tecniche', 'area']]]
];

var SOLO_MATRIMONIO = ['oraCerimonia', 'oraTorta', 'ingresso', 'primoBallo'];
function campiSchedaPrev(gruppo, tipo) {

function totaliPrev() {

// ─── Riepilogo
function calcolaRiepilogo(anno) {
  var r = { date: 0, passate: 0, dafare: 0, annullate: 0, totale: 0, netto: 0, lordo: 0, nero: 0,
    incassato: 0, daIncassare: 0, tipi: {}, canali: {}, mesi: [] };
  for (var i = 0; i < 12; i++) r.mesi.push({ fatto: 0, futuro: 0 });
  eventi().forEach(function (e) {
    if (!e.data || e.data.slice(0, 4) !== anno) return;
    if (e.stato === 'annullato') { r.annullate++; return; }
    var t = num(e.totale);
    r.date++;
    if (passato(e)) r.passate++; else r.dafare++;
    r.totale += t; r.netto += num(e.netto); r.lordo += num(e.lordo); r.nero += num(e.nero);
    r.incassato += incassato(e); r.daIncassare += residuo(e);
    var tp = e.tipo || 'Senza tipo';
    r.tipi[tp] = r.tipi[tp] || { n: 0, soldi: 0 }; r.tipi[tp].n++; r.tipi[tp].soldi += t;
    var c = e.tramite || 'Non indicato';
    r.canali[c] = r.canali[c] || { n: 0, soldi: 0 }; r.canali[c].n++; r.canali[c].soldi += t;
    r.mesi[parti(e.data).m - 1][passato(e) ? 'fatto' : 'futuro'] += t;
  });
  r.media = r.date ? r.totale / r.date : 0;
  r.aTesta = r.totale / ((DATI.liste && DATI.liste.membri.length) || 3);
  return r;
}

function barre(gruppi) {

  var max = Math.max.apply(null, l.map(function (x) { return x[1].soldi; }).concat([1]));
  return '<div class="barre">' + l.map(function (x) {
    return '<div class="b"><span>' + esc(x[0]) + ' <span class="tenue">(' + x[1].n + ')</span></span>' +
      '<i style="width:' + Math.round(x[1].soldi / max * 100) + '%"></i><span>' + euro(x[1].soldi) + '</span></div>';
  }).join('') + '</div>';
}

function vistaRiepilogo() {
  var a = anni();
  if (!a.length) return '<h1>Riepilogo</h1><p class="vuoto">Ancora nessun evento.</p>';
  if (a.indexOf(ANNO_RIEP) < 0) ANNO_RIEP = a.indexOf(DATI.oggi.slice(0, 4)) >= 0 ? DATI.oggi.slice(0, 4) : a[a.length - 1];
  var r = calcolaRiepilogo(ANNO_RIEP);

// ─── Server
function messaggio(err) { return String(err && err.message || err).replace(/^(Exception|Error):\s*/, ''); }

function suErrore(err) {
  occupato = false;
  var m = messaggio(err);
  if (m.indexOf('SESSIONE') >= 0) { esci(); avviso('Sessione scaduta: rientra con il tuo PIN.', true); return; }
  avviso(m, true);
}

/**
 * Copia degli ultimi dati sul dispositivo, per aprire l'app senza aspettare. Dal link di Google (dove la sessione dura 30
 * giorni) sta in localStorage; sul sito col Face ID solo in sessionStorage: chiusa l'app sparisce, così senza Face ID sul
 * telefono non resta niente di leggibile. Si scarta se è di un'altra versione o di un'altra persona.
 */
function salvaCopia(d) {
  try {
    var st = FUORI ? sessionStorage : localStorage;
    if (!d) { st.removeItem('copiaDati'); return; }
    var c = Object.assign({}, d); delete c.logo; delete c.avviso; delete c.ultimoId;
    st.setItem('copiaDati', JSON.stringify({ v: VERSIONE, tok: SESS.split('|')[0], d: c }));
  } catch (e) { /* spazio finito o storage bloccato: pazienza, si aspetta il server */ }
}
function copiaDati() {
  try {
    var x = JSON.parse((FUORI ? sessionStorage : localStorage).getItem('copiaDati') || 'null');
    if (!x || x.v !== VERSIONE || x.tok !== SESS.split('|')[0] || !x.d || x.d.login) return null;
    return x.d;
  } catch (e) { return null; }
}

function riceviDati(d) {
  DATI = d;
  if (d && !d.login && SESS) salvaCopia(d);
  if (d.logo && !LOGO) LOGO = d.logo;
  if (d.calendarioExtra) EXTRA = d.calendarioExtra;
  if (d.confrontoDate) CONFRONTO = d.confrontoDate;
  if (d.chatTrovate) CHAT_TG = d.chatTrovate;
  if (d.login && SESS) { SESS = ''; ricorda('tok', null); }
}

function ricarica() {
  google.script.run
    .withSuccessHandler(function (d) { riceviDati(d); disegna(); forseListaDaCompletare(); })
    .withFailureHandler(suErrore)
    .getDati(SESS);
}

/**
 * Scrive sul server. Con `ottimista` (una funzione che applica la modifica a DATI, ripetibile senza danni) la pagina
 * mostra subito il risultato e il server conferma dietro; i salvataggi ottimisti fatti nel frattempo aspettano in fila.
 * Se il server dà errore: avviso, `seErrore` (es. riapre il modulo) e si ricaricano i dati veri.
 */
var CODA = [];
function scrivi(nome, args, dopo, ottimista, seErrore) {
  var x = { nome: nome, args: args, dopo: dopo, ottimista: ottimista, seErrore: seErrore };
  if (occupato) {
    if (!ottimista) return; // doppio tocco su un salvataggio "normale": si ignora come prima
    CODA.push(x); ottimista(); disegna();
    return;
  }
  if (ottimista) { ottimista(); disegna(); }
  avvia(x);
}
function avvia(x) {
  occupato = true;
  avviso(x.nome === 'importa' || x.nome === 'sincronizza' ? 'Ci vuole qualche secondo…' : x.ottimista ? '☁️ Salvo…' : 'Salvataggio…');
  google.script.run
    .withSuccessHandler(function (d) {
      occupato = false;
      riceviDati(d);
      CODA.forEach(function (y) { if (y.ottimista) y.ottimista(); }); // quelli ancora in fila restano visibili
      var prossimo = CODA.shift();
      if (!prossimo) avviso('');
      if (d.avviso) avviso(d.avviso, /^⚠/.test(d.avviso), 9000);
      if (x.dopo) x.dopo(d); else disegna();
      if (prossimo) avvia(prossimo);
    })
    .withFailureHandler(function (err) {
      var falliti = [x].concat(CODA);
      CODA = [];
      suErrore(err);
      falliti.forEach(function (y) { if (y.seErrore) y.seErrore(); });
      if (x.ottimista) ricarica(); // la pagina aveva già mostrato la modifica: si torna ai dati veri
    })
    .azione(SESS, x.nome, x.args);
}

          if (!l || !l.length) return manda();
          var x = l[0];
          chiedi2('Nel calendario il ' + dataLunga(ev.data) + ' c\'è già "' + x.titolo + '"' + (x.ora ? ' (' + x.ora + ')' : '') +
            '. È lo stesso evento? Se sì lo aggiorno io e ne resta uno solo.', 'Sì, è lo stesso', 'No, è un altro',
            function () { manda({ calId: x.calId }); }, function () { manda({ nuovoNelCalendario: true }); });
        })
        .withFailureHandler(function () { avviso(''); manda(); })
        .similiCalendario(SESS, ev.data, ev.titolo);
    };
    if (gia) {
      return chiedi2('Il ' + dataLunga(ev.data) + ' c\'è già l\'evento "' + gia.titolo + '". È lo stesso (un\'altra proposta per loro)? ' +
        'Se sì, il preventivo si aggiunge a quell\'evento e nel calendario ne resta uno solo.', 'Sì, è lo stesso', 'No, è un altro',
        function () { P.eventoId = gia.id; manda(); }, calendario);
    }
    calendario();
  },
  altraProposta: function () {
    if (!PREV || !PREV.id) return;
    leggiModuloPrev();
    // stessa coppia, altro pacchetto: nuovo preventivo sullo stesso evento (nel calendario resta uno solo)
    PREV = Object.assign(JSON.parse(JSON.stringify(PREV)), { id: '', numero: '', stato: 'bozza', pdfId: '', pdfProgrammaId: '' });
    disegna();
    avviso('Nuova proposta per lo stesso evento: cambia pacchetto o extra e premi Salva.');
  },
  creaPdf: function (d) {
    if (!PREV || !PREV.id) return;
    var id = PREV.id;
    scrivi('creaPdf', { id: id, tipo: d.v === 'programma' ? 'programma' : 'preventivo' }, function (d) { var p = (d.preventivi || []).filter(function (x) { return x.id === id; })[0]; if (p) apriPrev(p); });
  },
  chiediEliminaPrev: function () {
    if (!PREV) return;
    var id = PREV.id;
    apriModale('<h2>Eliminare il preventivo ' + esc(PREV.numero) + '?</h2><p>Vuoi togliere anche l\'evento (dal calendario e dal foglio)?</p>' +
      '<div class="bottoni"><button class="btn-sec" data-az="annulla">Annulla</button>' +
      '<button class="btn-sec" data-az="eliminaPrev" data-id="' + esc(id) + '" data-v="">Solo il preventivo</button>' +
      '<button class="btn-pieno-pericolo" data-az="eliminaPrev" data-id="' + esc(id) + '" data-v="si">Anche l\'evento</button></div>', 'conferma');
  },
  eliminaPrev: function (d) {
    chiudiModale();
    scrivi('eliminaPreventivo', { id: d.id, ancheEvento: d.v === 'si' }, function () { PREV = null; vai('preventivi'); });
  },
  // listino
  listinoV: function (d) { LISTINO_V = d.v; disegna(); },
  apriVoce: function (d) { apriVoce(voceListino(d.id)); },
  nuovaVoce: function () { apriVoce(null); },
  salvaVoce: function () {
    var v = { id: VOCE_L.id, listino: VOCE_L.listino, tipo: VOCE_L.id ? VOCE_L.tipo : $('v-tipo').value };
    ['nome', 'prezzo', 'unita', 'descrizione', 'attivo'].forEach(function (k) { v[k] = String($('v-' + k).value || '').trim(); });
    if (!v.nome) return avviso('Scrivi il nome della voce.', true);
    if (!/^\d+([.,]\d{1,2})?$/.test(v.prezzo)) return avviso('Prezzo non valido.', true);
    chiudiModale();
    scrivi('salvaVoceListino', { voce: v }, function () { disegna(); });
  },
  // contatti
  filtroC: function (d) { FILTRO_C.ruolo = d.v; disegna(); },
  apriContatto: function (d) { if (MODALE) chiudiModale(); SEL_C = d.id; vai('contatto'); },
  nuovoContatto: function () { apriFormContatto(null, SEL); },
  nuovoContattoRuolo: function (d) { apriFormContatto(null, SEL, { ruolo: d.v }); },
  nuovoContattoRubrica: function () { apriFormContatto(null, ''); },
  referenteComeContatto: function () {
    var e = trova(SEL);
    if (e) apriFormContatto(null, SEL, { nome: e.referente, telefono: e.telefono, ruolo: e.tipo === 'Matrimonio' ? 'Sposi' : 'Altro' });
  },
  modificaContatto: function () { var c = contatto(SEL_C); if (c) apriFormContatto(c, ''); },
  salvaContatto: function () {
    var c = { id: BOZZA_K.id || '' };
    ['ruolo', 'nome', 'referente', 'telefono', 'email', 'instagram', 'indirizzo', 'note', 'sposa', 'telSposa', 'sposo', 'telSposo'].forEach(function (k) { c[k] = String(($('c-' + k) || {}).value || '').trim(); });
    if (CON_REFERENTE.indexOf(c.ruolo) < 0) c.referente = '';
    if (c.ruolo !== 'Sposi') { c.sposa = ''; c.telSposa = ''; c.sposo = ''; c.telSposo = ''; }
    if (!c.nome) return avviso('Scrivi il nome del contatto.', true);
    if (c.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) return avviso('L\'email non sembra giusta.', true);
    var ev = K_EVENTO, id = c.id || idTemporaneo(), campi = Object.assign({}, c);
    chiudiModale();
    scrivi('salvaContatto', { contatto: c, eventoId: ev }, function () { disegna(); }, function () {
      var l = DATI.contatti || (DATI.contatti = []), i = -1;
      l.forEach(function (x, j) { if (x.id === id) i = j; });
      var nuovo = Object.assign({}, i >= 0 ? l[i] : {}, campi, { id: id });
      if (i >= 0) l[i] = nuovo; else l.push(nuovo);
      var e = ev && trova(ev);
      if (e && idsContatti(e).indexOf(id) < 0) e.contatti = JSON.stringify(idsContatti(e).concat([id]));
    });
  },
  collega: function (d) {
    var ev = K_EVENTO;
    chiudiModale();
    scrivi('collegaContatto', { eventoId: ev, contattoId: d.id }, function () { disegna(); });
  },
  chiediScollega: function (d) {
    var c = contatto(d.id), ev = SEL;
    if (!c) return;
    chiedi('Togliere ' + c.nome + ' da questo evento? Resta comunque in rubrica.', 'Togli', function () {
      scrivi('scollegaContatto', { eventoId: ev, contattoId: c.id });
    });
  },
  chiediEliminaContatto: function () {
    var c = contatto(SEL_C);
    if (!c) return;
    chiedi('Eliminare ' + c.nome + ' dalla rubrica? Sparisce anche da tutti gli eventi.', 'Elimina', function () {
      scrivi('eliminaContatto', { id: c.id }, function () { SEL_C = ''; vai('contatti'); });
    });
  },
  // messaggi
  preparaMsg: function (d) { var x = CODA_MSG[d.i]; if (x) apriMessaggio(x); },
  inviaMail: function () {
    if (!MSG) return;
    var email = String($('m-email').value || '').trim();
    if (!email) return avviso('Scrivi l\'email a cui mandarlo (oppure usa WhatsApp).', true);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return avviso('L\'email non sembra giusta.', true);
    var args = { chiave: MSG.chiave, email: email, oggetto: $('m-oggetto').value, testo: $('m-testo').value };
    chiudiModale();
    scrivi('inviaMail', args, function () { disegna(); });
  },
  apertoWhatsapp: function () {
    // Il link apre WhatsApp; qui si chiede solo se è stato mandato davvero
    var x = MSG;
    setTimeout(function () {
      if (!x) return;
      MSG = x;
      apriModale('<h2>WhatsApp</h2><p>Hai mandato il messaggio a <b>' + esc(x.contatto.nome) + '</b>?</p>' +
        '<div class="bottoni"><button class="btn-sec" data-az="annulla">No, non ancora</button>' +
        '<button class="btn" data-az="segnaWhatsapp">Sì, mandato</button></div>', 'messaggio');
    }, 400);
  },
  segnaWhatsapp: function () { segna('whatsapp'); },
  chiediAnnullaInvio: function (d) {
    var i = ((DATI.invii) || []).filter(function (x) { return x.id === d.id; })[0];
    if (!i) return;
    var c = contatto(i.contattoId), chi = /^recap/.test(i.modello) ? 'il recap alla band' : 'il messaggio a ' + (c ? c.nome : '?');
    chiedi('Rimettere ' + chi + ' tra quelli da mandare?' + (i.canale === 'mail' || i.canale === 'telegram' ?
      ' Era già partito per ' + i.canale + ': quello non si può richiamare, qui si toglie solo il segno.' : ''), 'Rimetti', function () {
      scrivi('annullaInvio', { id: i.id }, function () { disegna(); });
    });
  },
  segnaFatto: function () { segna('fatto'); },
  segnaSaltato: function () { segna('saltato'); },
  apriModello: function (d) { SEL_M = d.id; vai('modello'); },
  salvaModello: function () {
    var m0 = ((DATI.modelli) || []).filter(function (x) { return x.id === SEL_M; })[0] || {};
    var tipo = m0.quando === 'richiesta' ? 'richiesta' : $('q-tipo').value, val = String(tipo === 'richiesta' ? '' : $('q-val').value || '').trim(), quando;
    if (tipo === 'richiesta') quando = 'richiesta';
    else if (tipo === 'giorni') {
      if (!/^\d{1,3}$/.test(val)) return avviso('Scrivi un numero di giorni, per esempio 10.', true);
      quando = 'giorni:' + Number(val);
    } else {
      var p = val.match(/^(\d{1,2})[\/.-](\d{1,2})$/);
      if (!p) return avviso('Scrivi giorno/mese, per esempio 01/11.', true);
      quando = 'data:' + ('0' + p[2]).slice(-2) + '-' + ('0' + p[1]).slice(-2);
    }
    scrivi('salvaModello', { modello: { id: SEL_M, oggetto: $('mm-oggetto').value, testo: $('mm-testo').value, quando: quando } },
      function () { vai('messaggi'); });
  },
  rigeneraFoglio: function () { scrivi('rigeneraFoglio', {}); },
  apriCalendario: function () { EXTRA = null; vai('calendario'); scrivi('controllaCalendario', {}); },
  apriUnione: function (d) {
    var x = coppieDoppioni()[Number(d.i)];
    if (!x) return;
    UNIONE = propostaUnione(x);
    var U = UNIONE;
    apriModale('<h2>Unisci i contatti</h2><p class="tenue" style="margin-top:0">Resta una scheda sola. Eventi e messaggi di "' + esc(U.togli.nome) +
      '" passano a quella; i dati che mancano (telefono, email…) si prendono dall\'altra.</p>' +
      '<label for="u-nome">Nome (per un locale: il nome del locale)</label><input id="u-nome" value="' + esc(U.nome) + '">' +
      '<label for="u-referente">Referente (la persona; vuoto se non serve)</label><input id="u-referente" value="' + esc(U.referente) + '">' +
      '<p class="tenue">Ruolo: ' + esc(U.tieni.ruolo) + (U.tieni.telefono || U.togli.telefono ? ' · tel. ' + esc(U.tieni.telefono || U.togli.telefono) : '') + '</p>' +
      '<div class="bottoni"><button class="btn-sec" data-az="annulla">Annulla</button><button class="btn" data-az="confermaUnione">Unisci</button></div>', 'unione');
  },
  confermaUnione: function () {
    if (!UNIONE) return;
    var a = { tieni: UNIONE.tieni.id, togli: UNIONE.togli.id, nome: String($('u-nome').value || '').trim(), referente: String($('u-referente').value || '').trim() };
    if (!a.nome) return avviso('Scrivi il nome.', true);
    chiudiModale(); UNIONE = null;
    scrivi('unisciContatti', a, function () { disegna(); });
  },
  nonDoppi: function (d) {
    var x = coppieDoppioni()[Number(d.i)];
    if (x) DOPPI_NO[x.a.id + '|' + x.b.id] = true;
    disegna();
  },
  apriConfronto: function () { CONFRONTO = null; SCELTI_C = { ids: {}, nuovi: {} }; vai('confronto'); scrivi('confrontaFoglioDate', {}); },
  sceltaConfronto: function (d) {
    var l = SCELTI_C[d.v === 'nuovi' ? 'nuovi' : 'ids'];
    if (l[d.id]) delete l[d.id]; else l[d.id] = true;
    disegna();
  },
  tuttiConfronto: function () {
    if (!CONFRONTO) return;
    CONFRONTO.diversi.forEach(function (x, i) { SCELTI_C.ids['d' + i] = true; });
    CONFRONTO.nuovi.forEach(function (x, i) { SCELTI_C.nuovi['n' + i] = true; });
    disegna();
  },
  nessunoConfronto: function () { SCELTI_C = { ids: {}, nuovi: {} }; disegna(); },
  applicaConfronto: function () {
    if (!CONFRONTO) return;
    var ids = CONFRONTO.diversi.filter(function (x, i) { return SCELTI_C.ids['d' + i]; }).map(function (x) { return x.id; });
    var nuovi = CONFRONTO.nuovi.filter(function (x, i) { return SCELTI_C.nuovi['n' + i]; }).map(function (x) { return x.chiave; });
    if (!ids.length && !nuovi.length) return avviso('Spunta prima cosa prendere dal foglio.', true);
    chiedi('Aggiornare ' + ids.length + ' eventi e aggiungerne ' + nuovi.length + ' dal foglio Date? Il foglio non viene toccato.', 'Aggiorna', function () {
      SCELTI_C = { ids: {}, nuovi: {} };
      scrivi('applicaFoglioDate', { ids: ids, nuovi: nuovi });
    });
  },
  daCalendario: function (d) {
    var x = EXTRA && EXTRA[d.i];
    if (x) scrivi('aggiungiDaCalendario', { calId: x.calId, data: x.data }, function (r) { disegna(); if (r.ultimoId) apriCompleta(r.ultimoId); });
  },
  completa: function (d) { apriCompleta(d.id, MODALE === 'lista'); },
  tornaLista: mostraListaDaCompletare,
  modificaTutto: function (d) { chiudiModale(); SEL = d.id; COMANDI.modifica(); },
  salvaCompleta: function () {
    if (!BOZZA_C) return;
    var ev = { id: BOZZA_C.id }, pieni = 0;
    CAMPI_C.forEach(function (k) {
      var v = String($('f-' + k).value || '').trim();
      if (!v) return;
      if (['totale', 'anticipo', 'netto', 'lordo', 'nero'].indexOf(k) >= 0) v = v.replace(/[€\s]/g, '').replace(',', '.');
      ev[k] = v; pieni++;
    });
    if (!pieni) return avviso('Compila almeno un campo, oppure premi ' + (DA_LISTA ? '"Elenco"' : '"Dopo"') + '.', true);
    var daLista = DA_LISTA;
    chiudiModale();
    scrivi('salvaEvento', { evento: ev }, function (r) {
      disegna();
      if (!r.avviso) avviso('Salvato ✓', false, 3000);
      if (daLista) mostraListaDaCompletare();
    });
  },
  ignoraCalendario: function (d) { var x = EXTRA && EXTRA[d.i]; if (x) scrivi('ignoraDaCalendario', { calId: x.calId, data: x.data }); },
  sincronizza: function () { scrivi('sincronizzaCalendario', {}); },
  chiediEsci: function () { chiedi('Uscire? Per rientrare servirà il PIN.', 'Esci', esci); },
  conferma: function () { var fn = alConferma; chiudiModale(); if (fn) fn(); },
  rispostaNo: function () { var fn = alNo; chiudiModale(); if (fn) fn(); },
  annulla: chiudiModale,
  ricarica: ricarica
};

document.addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-vai],[data-az]') : null;
  if (!el) return;
  if (el.dataset.vai) { if (V === 'modifica') BOZZA = null; return vai(el.dataset.vai); }
  var fn = COMANDI[el.dataset.az];
  if (fn) fn(el.dataset);
});

// La ricerca ridisegna solo l'elenco, così la tastiera resta aperta
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'cerca') { FILTRO.q = e.target.value; $('lista').innerHTML = listaHtml(); }
  if (e.target && PREV && V === 'preventivo' && /^(q-\d+|l-prezzo-\d+|l-nome-\d+|p-sconto)$/.test(e.target.id || '')) {
    var id = e.target.id, v = e.target.value;
    if (id === 'p-sconto') PREV.sconto = String(v).replace(',', '.');
    else if (id.indexOf('q-') === 0) PREV.righe[Number(id.slice(2))].qta = num(v);
    else if (id.indexOf('l-nome-') === 0) PREV.righe[Number(id.slice(7))].nome = String(v);
    else PREV.righe[Number(id.slice(9))].prezzo = num(v);
    // aggiorna solo l'elenco e i numeri, non i campi (così il cursore resta dov'è)
    var t = totaliPrev();
    $('t-voci').innerHTML = vociRecapHtml();
    $('t-sub').textContent = euro(t.sub); $('t-tot').textContent = euro(t.tot); $('t-acc').textContent = euro(t.acconto);
  }
  if (e.target && e.target.id === 'f-referente' && TEL_AUTO && $('f-telefono') && $('f-telefono').value === TEL_AUTO.tel &&
      normTxt(e.target.value) !== normTxt(TEL_AUTO.nome)) {
    $('f-telefono').value = ''; // era il numero di un altro (es. del wedding planner): per il nuovo referente va scritto il suo
    TEL_AUTO = null;
  }
  if (e.target && CAMPI_SUGG[e.target.id] && $('sugg-' + CAMPI_SUGG[e.target.id])) {
    var k = CAMPI_SUGG[e.target.id];
    mostraSugg(k, suggerimenti(k, e.target.value));
  }
  if (e.target && e.target.id === 'cerca-c') { FILTRO_C.q = e.target.value; $('lista-c').innerHTML = listaContattiHtml(); }
  if (e.target && e.target.id === 'm-testo' && MSG && $('m-wa')) $('m-wa').innerHTML = bottoniWa(MSG, e.target.value);
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'c-ruolo' && K_EVENTO && BOZZA_K && !BOZZA_K.id) $('c-rubrica').innerHTML = rubricaHtml(e.target.value);
  if (e.target && e.target.id === 'c-ruolo' && $('c-box-referente')) $('c-box-referente').style.display = CON_REFERENTE.indexOf(e.target.value) < 0 ? 'none' : '';
  if (e.target && e.target.id === 'c-ruolo' && $('c-box-sposi')) $('c-box-sposi').style.display = e.target.value === 'Sposi' ? '' : 'none';
  // nel preventivo il tipo decide quali voci mostrare (matrimonio sì/no): si ridisegna tenendo quello già scritto
  if (e.target && e.target.id === 'f-tipo' && V === 'preventivo' && PREV) { leggiModuloPrev(); disegna(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && (e.target.id === 'pin' || e.target.id === 'pin2')) COMANDI.entra();
});

// Ricarica da sola ogni 60 s, ma non mentre si scrive, c'è il modale o si è nel login
setInterval(function () {
  if (occupato || MODALE || ['modifica', 'calendario', 'modello', 'preventivo', 'listino'].indexOf(V) >= 0 || !SESS || !DATI || DATI.login) return;
  ricarica();
}, 60000);

// Avvio: con un token salvato si chiedono i dati veri, altrimenti basta il login
// Avvio istantaneo: con un token si mostrano subito gli ultimi dati salvati su questo dispositivo, poi arrivano quelli veri
if (SESS || !DATI) {
  var COPIA = SESS ? copiaDati() : null;
  DATI = COPIA || (SESS ? null : DATI);
  disegna();
  ricarica();
} else disegna();
</script>
